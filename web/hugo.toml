baseURL = 'https://andsav.dev'
locale = 'en-us'
title = "Andriy Savin"
theme = 'papermod'
[params]
  defaultTheme = "auto"
  ShowCodeCopyButtons = true
  subtitle = "Andriy Savin's tech blog"
  
  [params.homeInfoParams]
    Title = 'Welcome to my tech blog!'
    Content = "🌱 natural intelligence, organic programming"

  [[params.socialIcons]]
